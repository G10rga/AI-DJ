[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dj-set"
version = "0.1.0"
description = "Local house-music set builder"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
audio = ["librosa==1.0.0", "numpy==2.5.4", "scipy==1.18.1"]

[tool.setuptools.packages.find]
include = ["backend*"]
